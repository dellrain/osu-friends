# Пример для Ubuntu 22.04 + nginx.
# Скопируй в /etc/nginx/sites-available/osu-friends, поправь root и при необходимости порт API,
# затем: ln -s ... sites-enabled/ && nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 176.124.207.31;

    root /var/www/osu-friends/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # osu! API с того же origin, что и сайт (иначе браузер ловит CORS на osu.ppy.sh)
    location /api/osu-v2/ {
        proxy_pass https://osu.ppy.sh/api/v2/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host osu.ppy.sh;
        proxy_set_header Authorization $http_authorization;
        # GET /friends: osu! отдаёт mutual только если клиент передал x-api-version (см. osu-web FriendsController)
        proxy_set_header x-api-version $http_x_api_version;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/world {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/osu-token {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
